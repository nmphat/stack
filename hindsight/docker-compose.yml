name: hindsight

services:
  hindsight:
    image: ghcr.io/vectorize-io/hindsight:latest
    container_name: hindsight
    restart: unless-stopped
    ports:
      - "8890:8888"
      - "9991:9999"
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - hindsight_data:/home/hindsight/.pg0

volumes:
  hindsight_data:
