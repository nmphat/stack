services:
  termix:
    image: ghcr.io/lukegus/termix:latest
    container_name: termix
    healthcheck:
      test: timeout 10s bash -c ':> /dev/tcp/127.0.0.1/5674' || exit 1
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 90s
    ports:
      # Reached through the Cloudflare tunnel only.
      - "127.0.0.1:5674:5674"
    volumes:
      - ./data:/app/data:rw
    environment:
      PORT: 5674
    # Cho phep SSH nguoc ve chinh host OCI tu trong container.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # guacd chi co image amd64 -> exec format error tren aarch64.
  # Profile nay khien no khong tu khoi dong. Termix van chay: guacd chi
  # phuc vu RDP/VNC/telnet, con SSH thi Termix tu lam.
  guacd:
    profiles: ["amd64-only"]
    image: guacamole/guacd:latest
    container_name: termix-guacd
    ports:
      - "4822:4822"
    restart: unless-stopped
