services:
  beszel:
    image: henrygd/beszel:latest
    container_name: beszel
    restart: unless-stopped
    # Loopback only. cloudflared is the sole route in from outside.
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - ./beszel_data:/beszel_data
      - ./beszel_socket:/beszel_socket
    environment:
      APP_URL: https://oc-cp.3p.id.vn
      # The admin account is made from the CLI before the hostname exists, so
      # nobody can claim it through the open first-run form.
      USER_CREATION: "false"

  beszel-agent:
    image: henrygd/beszel-agent:latest
    container_name: beszel-agent
    restart: unless-stopped
    # Host networking is what lets the agent read the host's real interface
    # counters rather than the container's.
    network_mode: host
    volumes:
      - ./beszel_agent_data:/var/lib/beszel-agent
      - ./beszel_socket:/beszel_socket
      # Read-only: container stats only, no control over the daemon.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      # A unix socket in a shared volume, so the agent never opens a port.
      LISTEN: /beszel_socket/beszel.sock
      HUB_URL: http://localhost:8090
      TOKEN: ${BESZEL_TOKEN}
      KEY: ${BESZEL_KEY}
