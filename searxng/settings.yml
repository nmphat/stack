use_default_settings: true

general:
  instance_name: "SearXNG"

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "auto"
  formats:
    - html
    - json

server:
  secret_key: "set-via-SEARXNG_SECRET-env"
  limiter: false
  image_proxy: false

ui:
  static_use_hash: true
  default_theme: simple
